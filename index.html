<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Наш чат</title>
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e94560">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header .title {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(90deg, #e94560, #f39c12);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .who { font-size: 13px; color: #8899aa; }
  header .who b { color: #fff; }
  #messages {
    flex: 1; overflow-y: auto; padding: 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 78%; padding: 8px 12px; border-radius: 16px;
    font-size: 15px; line-height: 1.35; word-wrap: break-word;
    animation: pop .15s ease; position: relative;
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0.5; } to { transform: scale(1); opacity: 1; } }
  .msg .author { font-size: 12px; font-weight: 700; color: #f39c12; margin-bottom: 2px; }
  .msg .time { font-size: 10px; color: #aab; margin-left: 8px; float: right; margin-top: 4px; }
  .msg.other { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
  .msg.mine { align-self: flex-end; background: linear-gradient(135deg, #e94560, #c72c48); border-bottom-right-radius: 4px; }
  .msg.mine .author { color: #ffd7dd; }
  .msg.mine .time { color: #ffc7cf; }
  .system-msg {
    align-self: center; font-size: 12px; color: #8899aa;
    padding: 4px 10px; background: rgba(255,255,255,0.04); border-radius: 10px;
  }
  footer {
    flex-shrink: 0; padding: 10px 12px 14px;
    background: rgba(0,0,0,0.25);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08); color: #fff;
    border-radius: 22px; font-size: 15px; outline: none;
  }
  #input::placeholder { color: #667788; }
  #send {
    width: 48px; height: 48px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, #e94560, #c72c48);
    color: #fff; font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(233,69,96,0.4);
    transition: transform .1s; flex-shrink: 0;
  }
  #send:active { transform: scale(0.92); }
  #login {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 24px;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    z-index: 10;
  }
  #login h1 {
    font-size: 32px; margin: 0 0 8px;
    background: linear-gradient(90deg, #e94560, #f39c12, #e94560);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  #login p { color: #8899aa; margin: 0 0 30px; font-size: 14px; text-align: center; }
  #login input {
    width: 100%; max-width: 320px; padding: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff;
    border-radius: 14px; font-size: 16px; outline: none;
    margin-bottom: 14px; text-align: center;
  }
  #login input:focus { border-color: #e94560; }
  #login button {
    width: 100%; max-width: 320px; padding: 16px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #e94560, #c72c48);
    color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  #login button:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="login">
  <h1>Наш чат</h1>
  <p>Введи своё имя, чтобы войти</p>
  <input type="text" id="name-input" placeholder="Имя" maxlength="20" autocomplete="off">
  <button id="enter-btn">Войти</button>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="title">Наш чат</div>
    <div class="who">Ты: <b id="me-name">—</b></div>
  </header>
  <div id="messages"></div>
  <footer>
    <input type="text" id="input" placeholder="Сообщение..." autocomplete="off" maxlength="500">
    <button id="send">➤</button>
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDLP72ehULHCv9eqlI27TeQdhCDn6Mz83I",
    authDomain: "nash-chat-babb6.firebaseapp.com",
    databaseURL: "https://nash-chat-babb6-default-rtdb.firebaseio.com",
    projectId: "nash-chat-babb6",
    storageBucket: "nash-chat-babb6.firebasestorage.app",
    messagingSenderId: "1049984127512",
    appId: "1:1049984127512:web:4378cab82fb9cb8073a96d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const messagesRef = db.ref('messages');

  const loginScreen = document.getElementById('login');
  const appEl = document.getElementById('app');
  const nameInput = document.getElementById('name-input');
  const enterBtn = document.getElementById('enter-btn');
  const meName = document.getElementById('me-name');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let myName = localStorage.getItem('chatName') || '';
  let lastDate = '';

  if (myName) {
    loginScreen.style.display = 'none';
    enterApp();
  } else {
    nameInput.focus();
  }

  enterBtn.addEventListener('click', () => {
    const val = nameInput.value.trim();
    if (!val) { nameInput.focus(); return; }
    myName = val;
    localStorage.setItem('chatName', myName);
    loginScreen.style.display = 'none';
    enterApp();
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterBtn.click();
  });

  function enterApp() {
    appEl.style.display = 'flex';
    meName.textContent = myName;
    inputEl.focus();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function formatDate(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
    const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    if (sameDay(d, today)) return 'Сегодня';
    if (sameDay(d, yesterday)) return 'Вчера';
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  }

  messagesRef.limitToLast(200).on('child_added', (snapshot) => {
    const msg = snapshot.val();
    if (!msg || !msg.text) return;
    addMessageToScreen(msg);
  });

  function addMessageToScreen(msg) {
    const ts = msg.time || Date.now();
    const dateStr = formatDate(ts);
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      const sep = document.createElement('div');
      sep.className = 'system-msg';
      sep.textContent = dateStr;
      messagesEl.appendChild(sep);
    }
    const el = document.createElement('div');
    const mine = msg.name === myName;
    el.className = 'msg ' + (mine ? 'mine' : 'other');
    el.innerHTML =
      '<div class="author">' + (mine ? 'Ты' : escapeHtml(msg.name)) +
      '<span class="time">' + formatTime(ts) + '</span></div>' +
      '<div>' + escapeHtml(msg.text) + '</div>';
    messagesEl.appendChild(el);
    setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 10);
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    messagesRef.push({ name: myName, text: text, time: Date.now() })
      .catch(err => alert('Не удалось отправить: ' + err.message));
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
